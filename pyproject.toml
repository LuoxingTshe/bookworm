[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bookworm-research"
version = "2.0.0"
description = "Bookworm 蠹: autonomous literature retrieval and a structured sub-agent for research workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pyalex>=0.15",
    "httpx[socks]>=0.27",
    "typer>=0.12",
    "click>=8",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "networkx>=3.2",
    "rank-bm25>=0.2.2",
    "tenacity>=8.2",
]

[project.scripts]
bookworm = "bookworm.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "pyyaml>=6", "build>=1.2", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["bookworm*"]

[tool.setuptools.package-data]
bookworm = ["layout/*.cjs", "layout/*.js", "layout/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.ruff.lint]
select = ["F"]
