name: Bookworm
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check bookworm tests/unit
      - run: python -m pytest -q
      - run: node --test tests/unit/test_network_layout.cjs
      - run: python -m build
      - name: Verify installed wheel outside source tree
        run: |
          python -m venv /tmp/bookworm-wheel
          /tmp/bookworm-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/bookworm-wheel/bin/bookworm --version
          /tmp/bookworm-wheel/bin/bookworm --json schema
          /tmp/bookworm-wheel/bin/python -c "from bookworm.obsidian import LAYOUT_JS; assert LAYOUT_JS.is_file()"
